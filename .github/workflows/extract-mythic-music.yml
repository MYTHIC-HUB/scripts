name: Publish authorized MYTHIC audio

on:
  push:
    paths:
      - ".github/workflows/extract-mythic-music.yml"
      - "MYTHIC-HUB/approved-audio/MYTHIC_HUB_5_MUSICAS.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-audio:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Extract only the five approved MP3s
        shell: bash
        run: |
          python3 - <<'PY'
          import io
          import pathlib
          import zipfile

          source = pathlib.Path("MYTHIC-HUB/approved-audio/MYTHIC_HUB_5_MUSICAS.zip")
          target = pathlib.Path("MYTHIC-HUB/approved-audio")
          names = (
              "i-non-mi-innamorero.mp3",
              "1-thing-hoodtrap.mp3",
              "sou-favela.mp3",
              "tseluy.mp3",
              "amor-emmanuel.mp3",
          )
          if not source.is_file():
              raise SystemExit("ZIP das músicas ausente.")
          with zipfile.ZipFile(source) as archive:
              for name in names:
                  member = "MYTHIC-HUB/audio/" + name
                  if member not in archive.namelist():
                      raise SystemExit("Faltando no ZIP: " + member)
                  info = archive.getinfo(member)
                  if not (128 <= info.file_size <= 10 * 1024 * 1024):
                      raise SystemExit("Tamanho MP3 inválido: " + name)
                  data = archive.read(member)
                  if len(data) != info.file_size:
                      raise SystemExit("Arquivo incompleto: " + name)
                  is_id3 = data[:3] == b"ID3"
                  is_frame = len(data) > 1 and data[0] == 255 and (data[1] & 224) == 224
                  if not (is_id3 or is_frame):
                      raise SystemExit("Cabeçalho MP3 inválido: " + name)
                  output = target / name
                  output.write_bytes(data)
                  print(f"Pronto: {output} ({len(data)} bytes)")
          PY

      - name: Commit authorized MP3 files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MYTHIC-HUB/approved-audio/*.mp3
          if git diff --cached --quiet; then
            echo "Áudios já estavam publicados."
            exit 0
          fi
          git commit -m "Publish authorized MYTHIC audio MP3s from uploaded ZIP"
          git push
